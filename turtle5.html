<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Урок 5 · Разработка и отладка проекта — Я — исследователь: рисуем кодом</title>
<style>
/* ===== ПЕРЕМЕННЫЕ (единый стиль курса) ===== */
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --accent:#0071e3;
  --accent-hover:#0077ed;
  --green:#34c759;
  --green-dark:#248a3d;
  --red:#ff3b30;
  --line:#e8e8ed;
  --line-soft:#f0f0f2;
  --radius:18px;
  --shadow:0 1px 3px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:760px;margin:0 auto;padding:16px 16px 56px}

/* ===== ТИПОГРАФИКА ===== */
h1{font-size:clamp(24px,5.5vw,32px);letter-spacing:-.02em;margin:0 0 8px;line-height:1.2}
h1:focus{outline:none}
h2{font-size:18px;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
.subtitle{color:var(--muted);margin:0 0 20px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
p{margin:0 0 10px}
b{font-weight:650}
code{font-family:var(--mono);font-size:.92em;background:#f0f0f2;border-radius:5px;padding:1px 5px}

/* ===== ВЕРХНЯЯ ПАНЕЛЬ / ШАГИ ===== */
.topbar{
  position:sticky;top:0;z-index:10;
  background:rgba(245,245,247,.85);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.lesson-badge{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;text-decoration:none}
.lesson-badge:hover{color:var(--accent)}
.stepper{list-style:none;display:flex;gap:14px;margin:0;padding:0}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.step .dot{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#e3e3e8;color:var(--muted);font-size:12px;font-weight:600;flex:none;
}
.step.current .dot{background:var(--accent);color:#fff}
.step.current{color:var(--text);font-weight:600}
.step.done .dot{background:var(--green);color:#fff}
.step-label{display:none}
@media(min-width:560px){.step-label{display:inline}}

/* ===== КАРТОЧКИ ===== */
.card{
  background:var(--card);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:16px;
}
.card.tinted{background:#f0f7ff}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== КНОПКИ ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:12px 22px;border-radius:12px;border:none;
  font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:background .15s ease,transform .1s ease,opacity .15s ease;
  text-decoration:none;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:#e8e8ed;color:var(--text)}
.btn-secondary:hover{background:#dcdce2}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid #d2d2d7}
.btn-ghost:hover{background:#f0f7ff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.actions .btn{flex:1 1 180px}
.back-link{
  background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;padding:10px 4px;min-height:44px;margin-bottom:4px;
}
.back-link:hover{text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,label.opt:focus-within,label.check-item:focus-within{
  outline:3px solid rgba(0,113,227,.4);outline-offset:2px;border-radius:8px;
}

/* ===== ФОРМЫ ===== */
.field{margin-bottom:18px}
.field label,.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text)}
input[type="text"],select,textarea{
  width:100%;padding:12px 14px;min-height:44px;font-size:16px;font-family:inherit;
  border:1px solid #d2d2d7;border-radius:12px;background:#fff;color:var(--text);
}
input[type="text"]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(0,113,227,.2)}
textarea{font-family:var(--mono);font-size:14px;line-height:1.6;resize:vertical}
textarea.plain-ta{font-family:inherit;font-size:15px}
.err{color:var(--red);font-size:14px;margin:6px 0 0}
.start-card{text-align:center;padding:32px 24px}
.logo{font-size:56px;line-height:1;margin-bottom:12px}
.start-card form{text-align:left;margin-top:20px}
.saved-note{
  background:#f0f7ff;border:1px solid #cde5ff;border-radius:12px;
  padding:12px 14px;font-size:14px;margin-top:16px;text-align:left;
}
.home-link{font-size:14px;color:var(--muted);text-decoration:none;display:inline-block;margin-top:14px}
.home-link:hover{color:var(--accent);text-decoration:underline}

/* ===== КОД ===== */
pre.code{
  background:#f5f5f7;border:1px solid var(--line);border-radius:12px;
  padding:14px;overflow-x:auto;margin:0 0 12px;
  font-family:var(--mono);font-size:14px;line-height:1.6;color:#1d1d1f;
}
.code-cap{font-size:13px;color:var(--muted);margin:0 0 8px}

/* ===== ТАБЛИЦЫ ===== */
.ref-table{width:100%;border-collapse:collapse;font-size:14px}
.ref-table td,.ref-table th{padding:9px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top;text-align:left}
.ref-table tr:last-child td,.ref-table tr:last-child th{border-bottom:none}
.ref-table td:first-child,.ref-table th:first-child{font-family:var(--mono);color:var(--accent);white-space:nowrap;font-weight:600}
.ref-table.plain td:first-child,.ref-table.plain th:first-child{font-family:inherit;color:var(--text);font-weight:650;white-space:normal}

/* ===== ТЕСТ ===== */
.quiz-card{padding:18px 20px}
.q-title{display:flex;gap:10px;align-items:flex-start;font-size:16px;margin-bottom:12px}
.q-num{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.q-title pre.code{margin:8px 0 0;font-size:13px}
label.opt{
  display:flex;gap:10px;align-items:flex-start;
  padding:12px 14px;border:1px solid #d2d2d7;border-radius:12px;
  min-height:44px;cursor:pointer;margin-bottom:8px;font-size:15px;
  transition:border-color .15s ease,background .15s ease;background:#fff;
}
label.opt:hover{border-color:#b8b8be}
label.opt input{margin-top:3px;accent-color:var(--accent);flex:none;width:18px;height:18px}
label.opt.correct{border-color:var(--green);background:#f0fbf3}
label.opt.wrong{border-color:var(--red);background:#fff5f5}
label.opt.disabled{cursor:default}
.explain{font-size:14px;border-radius:10px;padding:10px 12px;margin:10px 0 0}
.explain.ok{background:#f0fbf3;color:var(--green-dark)}
.explain.bad{background:#fff5f5;color:#c9302c}
.score-banner{
  text-align:center;font-size:17px;background:#f0f7ff;border:1px solid #cde5ff;
}

/* ===== ЧЕК-ЛИСТ ===== */
.check-list{list-style:none;margin:0;padding:0}
label.check-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:11px 2px;border-bottom:1px solid var(--line-soft);
  font-size:15px;cursor:pointer;min-height:44px;
}
label.check-item:last-child{border-bottom:none}
label.check-item input{
  width:22px;height:22px;flex:none;margin-top:2px;
  accent-color:var(--green);cursor:pointer;
}
.check-progress{font-weight:650;color:var(--accent)}

/* ===== ПРОЕКТ УРОКА 4 (напоминание) ===== */
.l4-row{display:flex;gap:8px;font-size:14.5px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.l4-row:last-child{border-bottom:none}
.l4-k{flex:none;width:96px;color:var(--muted);font-weight:600}
.l4-v{white-space:pre-wrap;word-break:break-word}

/* ===== ТРЕНАЖЁР ===== */
.sim-wrap{display:flex;flex-direction:column;gap:14px}
#sim-canvas{
  width:100%;max-width:320px;height:auto;aspect-ratio:1/1;
  border:1px solid var(--line);border-radius:16px;background:#fff;
  display:block;margin:0 auto;
}
.sim-controls{display:flex;gap:10px;flex-wrap:wrap}
.sim-controls .btn{flex:1 1 130px;padding:10px 14px;font-size:15px}
.sim-speed{display:flex;align-items:center;gap:10px}
.sim-speed label{font-size:14px;font-weight:600;white-space:nowrap;margin:0}
.sim-speed select{width:auto;flex:1;min-width:150px}
.status{font-size:14px;min-height:22px;margin:0;color:var(--muted)}
.status-err{color:var(--red)}
.status-ok{color:var(--green-dark);font-weight:600}
details.help{background:#f5f5f7;border-radius:12px;padding:4px 14px;margin:0}
details.help summary{cursor:pointer;font-weight:600;font-size:15px;padding:10px 0;min-height:44px}
details.hint{background:#fffbeb;border-radius:12px;padding:4px 14px;margin-top:8px}
details.hint summary{cursor:pointer;font-weight:600;font-size:14px;color:#8a6d1a;padding:10px 0;min-height:44px}
details.hint pre.code{margin:8px 0 12px}

/* ===== ЗАДАНИЯ ===== */
.task{display:flex;gap:12px;margin-bottom:14px}
.task:last-child{margin-bottom:0}
.task-body{flex:1;min-width:0}
.task-num{
  flex:none;width:30px;height:30px;border-radius:10px;background:#f0f7ff;color:var(--accent);
  font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;
}
.task h3{margin-bottom:2px}
.task p{margin:0;font-size:14px;color:var(--muted)}

/* ===== ФАЙЛ / РИСУНОК ===== */
.steps-list{margin:0 0 4px;padding-left:20px;font-size:15px}
.steps-list li{margin-bottom:8px}
.shot-img{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-bottom:8px}
.shot-cap{font-size:13px;color:var(--muted);margin:0 0 10px}
input[type="file"]{font-size:15px;max-width:100%}
input[type="file"]::file-selector-button{
  min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid #d2d2d7;
  background:#fff;font-family:inherit;font-size:14px;font-weight:600;color:var(--accent);
  cursor:pointer;margin-right:12px;
}
.btn-from-sim{margin-top:10px;min-height:40px;padding:8px 16px;font-size:14px}

/* ===== ИТОГ ===== */
.result-hero{text-align:center;padding:28px 20px}
.result-total{font-size:44px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.result-rating{font-size:17px;color:var(--text);margin:0 0 4px}
.res-rows{margin:0;padding:0;list-style:none}
.res-rows li{
  display:flex;justify-content:space-between;gap:12px;
  padding:11px 2px;border-bottom:1px solid var(--line-soft);font-size:15px;
}
.res-rows li:last-child{border-bottom:none}
.res-rows .pts{font-weight:650;white-space:nowrap}
.ok-mark{color:var(--green-dark)}
.bad-mark{color:var(--red)}
.lesson-nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.lesson-nav .btn{flex:1 1 180px}

/* ===== ПЕЧАТЬ / PDF ===== */
#print-report{display:none}
.pr-h1{font-size:20px;margin:0 0 4px}
.pr-sub{font-size:13px;color:#555;margin:0 0 14px}
.pr-meta{font-size:14px;margin:0 0 14px;line-height:1.7}
.pr-h2{font-size:16px;margin:18px 0 8px;border-bottom:1px solid #ddd;padding-bottom:4px}
.pr-quiz{font-size:13px;padding-left:18px;margin:0}
.pr-quiz li{margin-bottom:6px}
.pr-checks{font-size:13px;padding-left:18px;margin:0}
.pr-checks li{margin-bottom:4px}
.pr-text{font-size:13px;background:#f5f5f5;border:1px solid #ddd;border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-word;page-break-inside:avoid}
.pr-code{
  font-family:var(--mono);font-size:12px;background:#f5f5f5;border:1px solid #ddd;
  border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-word;
  page-break-inside:avoid;
}
.pr-img{max-width:100%;max-height:420px;border:1px solid #ddd;border-radius:6px;page-break-inside:avoid}
.pr-total{font-size:15px;margin-top:14px}
@media print{
  body{background:#fff}
  .app-ui{display:none!important}
  #print-report{display:block;padding:0 4mm}
  @page{margin:12mm}
}
</style>
</head>
<body>

<div id="app" class="app-ui"></div>
<div id="print-report" aria-hidden="true"></div>

<script>
'use strict';

/* ============================================================
   КОНСТАНТЫ
============================================================ */
var LS_KEY = 'turtle_lesson5_v1';
var LS_KEY_L4 = 'turtle_lesson4_v1'; // чтобы подтянуть паспорт проекта из Урока 4

var COURSE_NAME = '«Я — исследователь: первые шаги в программировании»';
var LESSON_TITLE = 'Разработка и отладка проекта';

var STEPS = ['Теория','Тест','Проект','Итог'];

/* Тест по отладке и тестированию */
var QUIZ = [
  {
    q: 'Программа сообщает: «непонятная команда „froward“». В чём причина ошибки?',
    options: [
      'Опечатка в названии команды — правильно forward',
      'Команду froward нельзя использовать с черепашкой',
      'Нужно написать число побольше'
    ],
    correct: 0,
    explain: 'Классическая опечатка! Компьютер не догадывается — он понимает только точно написанные команды: forward, а не froward.'
  },
  {
    q: 'Черепашка ходит по полю, но линия за ней НЕ рисуется. Что случилось?',
    options: [
      'Слишком тонкая линия',
      'После penup забыли написать pendown — фломастер остался поднят',
      'Черепашка сломалась'
    ],
    correct: 1,
    explain: 'penup поднимает фломастер, pendown — опускает. Если между ними идти, черепашка просто переместится без линии.'
  },
  {
    q: 'Квадрат «не замыкается» — фигура получилась кривой. Что проверить в первую очередь?',
    options: [
      'Угол поворота: для квадрата должно быть 90° (360 : 4)',
      'Цвет линии',
      'Название черепашки'
    ],
    correct: 0,
    explain: 'Если фигура не замыкается — скорее всего, неверный угол. Вспомни секрет: угол = 360 : число сторон.'
  },
  {
    q: 'Что значит «тестировать программу»?',
    options: [
      'Запустить её и проверить: результат совпадает с задуманным',
      'Удалить программу и написать заново',
      'Показать программу другу'
    ],
    correct: 0,
    explain: 'Тестирование — это проверка: запустил, сравнил с планом и эскизом, убедился, что всё работает как задумано.'
  },
  {
    q: 'В программе несколько ошибок. Как исправлять их правильно?',
    options: [
      'Исправить всё сразу и запустить один раз',
      'Исправлять по одной ошибке и каждый раз заново запускать программу',
      'Исправлять ошибки с конца программы'
    ],
    correct: 1,
    explain: 'По одной! Исправил — запустил — проверил. Так сразу видно, помогло ли исправление и не появилась ли новая ошибка.'
  }
];

/* Чек-лист проверки проекта (из планирования курса) */
var CHECKLIST = [
  'Программа запускается и работает без ошибок',
  'Рисунок соответствует моей идее и плану из Урока 4',
  'Я использую команды курса: движение, повороты, цвет, толщину',
  'В программе есть хотя бы один цикл (repeat или for ... range)',
  'В коде есть комментарии # — я могу объяснить свою программу',
  'Оформление продумано: цвета сочетаются, толщина линий подходит, нет «лишних» линий',
  'Финальный рисунок скачан и прикреплён к отчёту'
];

/* Цвета черепашки (английские + русские названия) */
var COLOR_MAP = {
  'black':'#1d1d1f','чёрный':'#1d1d1f','черный':'#1d1d1f',
  'red':'#ff3b30','красный':'#ff3b30',
  'orange':'#ff9500','оранжевый':'#ff9500',
  'yellow':'#e6b800','жёлтый':'#e6b800','желтый':'#e6b800',
  'green':'#34c759','зелёный':'#34c759','зеленый':'#34c759',
  'blue':'#007aff','синий':'#007aff',
  'skyblue':'#5ac8fa','голубой':'#5ac8fa',
  'purple':'#af52de','фиолетовый':'#af52de',
  'pink':'#ff2d55','розовый':'#ff2d55',
  'brown':'#a2845e','коричневый':'#a2845e',
  'gray':'#8e8e93','grey':'#8e8e93','серый':'#8e8e93',
  'white':'#ffffff','белый':'#ffffff'
};

/* Команды, которые тренажёр молча пропускает (служебные строки Python) */
var IGNORE_CMDS = ['shape','speed','hideturtle','showturtle','done','exitonclick',
  'screensize','setup','title','bgcolor','tracer','delay'];

/* Скорости анимации (мс на один тик) */
var SPEEDS = { slow: 520, normal: 280, fast: 90 };

/* Код с тремя ошибками — задание на отладку */
var BUGGY_CODE =
'# Программа «Звезда» — в ней 3 ошибки!\n' +
'color blak\n' +
'width 3\n' +
'repeat 5:\n' +
'forward 80\n' +
'rigth 144';

var FIXED_CODE =
'# Программа «Звезда» — все ошибки исправлены\n' +
'color black\n' +
'width 3\n' +
'repeat 5:\n' +
'  forward 80\n' +
'  right 144';

/* ============================================================
   СОСТОЯНИЕ
============================================================ */
function freshState(){
  return {
    screen: 'start',
    name: '',
    klass: '',
    quiz: { answers: [null,null,null,null,null], checked: false, score: 0 },
    project: {
      title: '',                 // название финального проекта
      code: '', shotName: '', hasShot: false,
      reflection: '',            // рефлексия для итогового отчёта
      checks: [false,false,false,false,false,false,false]
    },
    shotUrl: null,               // не сохраняется (blob живёт только в сессии)
    simCode: ''
  };
}
var state = freshState();
var savedData = null;            // данные из localStorage при старте

/* Паспорт проекта из Урока 4 (идея / название / план) — только для чтения */
var lesson4 = null;
(function loadLesson4(){
  try{
    var raw = localStorage.getItem(LS_KEY_L4);
    if (raw){
      var d = JSON.parse(raw);
      if (d && d.project){
        lesson4 = {
          idea: d.project.idea || '',
          title: d.project.title || '',
          plan: d.project.plan || ''
        };
      }
    }
  }catch(e){ lesson4 = null; }
})();

/* Состояние тренажёра (не сохраняется) */
var sim = {
  segments: [],
  turtle: { x:150, y:150, h:0, pen:true, color:'#1d1d1f', width:2 },
  running: false, timer: null, ops: [], idx: 0, delay: 280, batch: 1
};

/* ============================================================
   СОХРАНЕНИЕ / ЗАГРУЗКА ПРОГРЕССА
============================================================ */
function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      screen: state.screen, name: state.name, klass: state.klass,
      quiz: state.quiz,
      project: {

function el(id){ return document.getElementById(id); }
function debounce(fn, ms){
  var t = null;
  return function(){
    var args = arguments, self = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(self, args); }, ms);
  };
}
function firstName(){
  var n = state.name.trim().split(/\s+/);
  return n.length ? n[0] : '';
}

============================================================ */
function allChecksDone(){
  for (var i=0;i<state.project.checks.length;i++){
    if (!state.project.checks[i]) return false;
  }
  return true;
}
function computeScore(){
  var correct = 0;
  for (var i=0;i<QUIZ.length;i++){
    if (state.quiz.answers[i] === QUIZ[i].correct) correct++;
  }
  var quizPoints = state.quiz.checked ? correct*2 : 0;               // макс 10
  var codePoints = state.project.code.trim().length >= 10 ? 5 : 0;   // макс 5
  var shotPoints = state.project.hasShot ? 5 : 0;                    // макс 5
  var total = quizPoints + codePoints + shotPoints;                  // макс 20
  return {
    correct: correct, quizPoints: quizPoints,
    codePoints: codePoints, shotPoints: shotPoints,
    total: total, percent: Math.round(total/20*100)
  };
}
function ratingText(total){
  if (total >= 18) return 'Великолепно! Ты настоящий программист-исследователь. Ждём тебя в техническом классе! 🏆';
  if (total >= 13) return 'Отличная работа! Проект завершён — так держать 👍';
  return 'Курс пройден! Загляни в теорию и отшлифуй свой проект — у тебя всё получится 📚';
}

    if (ok){ state.name = name; state.klass = classInput.value; }

  }

function setupQuiz(){
  var s = state.quiz;
  if (!s.checked){
    for (var i=0;i<QUIZ.length;i++){
      (function(idx){
        var radios = document.querySelectorAll('input[name="q' + idx + '"]');
        for (var k=0;k<radios.length;k++){
          radios[k].addEventListener('change', function(){
            state.quiz.answers[idx] = parseInt(this.value, 10);
            el('quiz-err').hidden = true;
            save();
          });
        }
      })(i);
    }
    el('quiz-check').addEventListener('click', function(){
      var unanswered = 0;
      for (var j=0;j<QUIZ.length;j++){
        if (state.quiz.answers[j] === null) unanswered++;
      }
      if (unanswered > 0){
        var err = el('quiz-err');
        err.hidden = false;
        err.textContent = 'Осталось ответить на ' + unanswered + ' вопрос(ов). Выбери вариант в каждой карточке.';
        return;
      }
      var score = 0;
      for (var m=0;m<QUIZ.length;m++){
        if (state.quiz.answers[m] === QUIZ[m].correct) score++;
      }
      state.quiz.score = score;
      state.quiz.checked = true;
      save(); render();
    });
  } else {
    el('quiz-retry').addEventListener('click', function(){
      state.quiz = { answers:[null,null,null,null,null], checked:false, score:0 };
      save(); render();
    });
    el('quiz-next').addEventListener('click', function(){
      state.screen = 'practice'; save(); render();
    });
  }
}

/* ---------- Мини-интерпретатор команд (без eval!) ----------
   Понимает линейные команды И циклы:
   repeat N: / for i in range(N): + тело с отступом.
   Циклы раскрываются (flatten) в линейный список операций. */
function toNum(v){
  if (v === undefined || v === '') return null;
  var n = Number(v);
  return isFinite(n) ? n : null;
}
function parseError(line, text){
  var e = new Error(text);
  e.parseLine = line;
  return e;
}
function indentOf(raw){
  var m = raw.match(/^\s*/);
  return m ? m[0].replace(/\t/g, '  ').length : 0; // таб = два пробела
}
function pushOps(target, add, ctx, ln){
  for (var i=0;i<add.length;i++){
    var op = add[i];
    ctx.count += (op.t === 'circle') ? 36 : 1;
    if (ctx.count > 4000){
      throw parseError(ln, 'Программа получилась слишком длинной — больше 4000 шагов. Уменьши число повторений в цикле.');
    }
    target.push(op);
  }
}
function parseCommand(parts, ln){
  var cmd = parts[0], arg = parts[1];
  function needNum(name){
    throw parseError(ln, 'после ' + name + ' нужно написать число, например: ' + name + ' 100');
  }
  if (cmd === 'forward' || cmd === 'fd'){
    var n1 = toNum(arg); if (n1 === null) needNum(cmd);
    return { t:'fd', d: Math.max(-1000, Math.min(1000, n1)) };
  }
  if (cmd === 'backward' || cmd === 'back' || cmd === 'bk'){
    var n2 = toNum(arg); if (n2 === null) needNum(cmd);
    return { t:'fd', d: -Math.max(-1000, Math.min(1000, n2)) };
  }
  if (cmd === 'right' || cmd === 'rt'){
    var a1 = toNum(arg); if (a1 === null) needNum(cmd);
    return { t:'turn', a:a1 };
  }
  if (cmd === 'left' || cmd === 'lt'){
    var a2 = toNum(arg); if (a2 === null) needNum(cmd);
    return { t:'turn', a:-a2 };
  }
  if (cmd === 'penup' || cmd === 'pu' || cmd === 'up')  return { t:'pen', v:false };
  if (cmd === 'pendown' || cmd === 'pd' || cmd === 'down') return { t:'pen', v:true };
  if (cmd === 'color' || cmd === 'pencolor'){
    if (!arg) throw parseError(ln, 'после color напиши цвет, например: color red');
    var c = COLOR_MAP[arg];
    if (!c) throw parseError(ln, 'не знаю цвет «' + arg + '». Попробуй: red, blue, green, yellow, orange, purple, pink, brown, black.');
    return { t:'color', v:c };
  }
  if (cmd === 'width' || cmd === 'pensize'){
    var w = toNum(arg); if (w === null) needNum(cmd);
    return { t:'width', v: Math.max(1, Math.min(20, w)) };
  }
  if (cmd === 'circle'){
    var r = toNum(arg); if (r === null) needNum('circle');
    if (Math.abs(r) > 300) throw parseError(ln, 'слишком большой круг — радиус должен быть не больше 300');
    return { t:'circle', r:r };
  }
  if (cmd === 'home')  return { t:'home' };
  if (cmd === 'clear') return { t:'clear' };
  if (IGNORE_CMDS.indexOf(cmd) !== -1) return null; // служебные команды Python пропускаем
  throw parseError(ln, 'непонятная команда «' + parts[0] + '». Загляни в шпаргалку и проверь, правильно ли она написана.');
}

/* Рекурсивный разбор блока строк с учётом отступов и циклов */
function parseBlock(lines, pos, minIndent, depth, ctx){
  var ops = [];
  while (pos < lines.length){
    var raw = lines[pos];
    var trimmed = raw.trim();
    if (!trimmed){ pos++; continue; }
    var indent = indentOf(raw);
    if (indent < minIndent) break; // блок закончился
    var ln = pos + 1;
    var line = trimmed.toLowerCase().replace(/t\s*\.\s*/g, '');
    if (line.charAt(0) === '#'){ pos++; continue; }        // комментарий
    if (line.indexOf('import') === 0){ pos++; continue; }  // import turtle
    if (/^[a-z_][a-z0-9_]*\s*=/.test(line)){ pos++; continue; } // t = turtle.Turtle()

    // заголовок цикла: repeat N: / for i in range(N):
    var m = line.match(/^repeat\s+(\S+?)\s*:?$/) ||
            line.match(/^for\s+[a-z_][a-z0-9_]*\s+in\s+range\s*\(\s*(\S+?)\s*\)\s*:?$/);
    if (m){
      if (depth >= 3) throw parseError(ln, 'Цикл в цикле в цикле — так глубоко нельзя (максимум 3 уровня).');
      var n = Number(m[1]);
      if (!isFinite(n) || Math.floor(n) !== n || n < 1 || n > 360){
        throw parseError(ln, 'В цикле нужно целое число повторений от 1 до 360, например: repeat 4:');
      }
      var body = parseBlock(lines, pos + 1, indent + 1, depth + 1, ctx);
      if (!body.ops.length){
        throw parseError(ln, 'Внутри цикла нет команд. Напиши их с отступом — два пробела в начале строки.');
      }
      for (var k=0;k<n;k++){ pushOps(ops, body.ops, ctx, ln); }
      pos = body.nextPos;
      continue;
    }

    // обычная команда
    var cmdLine = line.replace(/[(),]/g, ' ').replace(/['"]/g, ' ');
    var parts = cmdLine.split(/\s+/).filter(Boolean);
    if (!parts.length){ pos++; continue; }
    var op = parseCommand(parts, ln);
    if (op) pushOps(ops, [op], ctx, ln);
    pos++;
  }
  return { ops: ops, nextPos: pos };
}

function parseProgram(text){
  var lines = String(text).split('\n');
  try{
    var res = parseBlock(lines, 0, 0, 0, { count: 0 });
    return { ops: res.ops, error: null };
  }catch(e){
    if (e && e.parseLine !== undefined){
      return { ops:null, error:{ line:e.parseLine, text:e.message } };
    }
    return { ops:null, error:{ line:1, text:'Не удалось разобрать программу. Проверь команды по шпаргалке.' } };
  }
}

/* ---------- Отрисовка поля ---------- */
function simReset(){
  sim.segments = [];
  sim.turtle = { x:150, y:150, h:0, pen:true, color:'#1d1d1f', width:2 };
  simDraw();
}
function simDraw(){
  var cv = el('sim-canvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  ctx.clearRect(0,0,300,300);
  // сетка
  ctx.strokeStyle = '#f0f0f2'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (var g=25; g<300; g+=25){
    ctx.moveTo(g+.5,0); ctx.lineTo(g+.5,300);
    ctx.moveTo(0,g+.5); ctx.lineTo(300,g+.5);
  }
  ctx.stroke();
  // линии рисунка
  ctx.lineCap = 'round';
  for (var i=0;i<sim.segments.length;i++){
    var s = sim.segments[i];
    ctx.strokeStyle = s.c; ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
  }
  // черепашка
  var t = sim.turtle;
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.h * Math.PI / 180);
  ctx.fillStyle = '#34c759';
  ctx.strokeStyle = '#248a3d';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(12,0); ctx.stroke(); // куда смотрит
  ctx.restore();
}
function simMove(dist){
  var t = sim.turtle;
  var rad = t.h * Math.PI / 180;
  var nx = t.x + dist * Math.cos(rad);
  var ny = t.y + dist * Math.sin(rad);
  if (t.pen) sim.segments.push({ x1:t.x, y1:t.y, x2:nx, y2:ny, c:t.color, w:t.width });
  t.x = nx; t.y = ny;
}
function applyOp(op){
  var t = sim.turtle;
  switch(op.t){
    case 'fd': simMove(op.d); break;
    case 'turn': t.h = (t.h + op.a) % 360; break;
    case 'pen': t.pen = op.v; break;
    case 'color': t.color = op.v; break;
    case 'width': t.width = op.v; break;
    case 'circle':
      var steps = 36;
      var seg = (2 * Math.PI * Math.abs(op.r)) / steps;
      var dir = op.r >= 0 ? -10 : 10; // положительный радиус — против часовой
      for (var i=0;i<steps;i++){ simMove(seg); t.h += dir; }
      break;
    case 'home': t.x = 150; t.y = 150; t.h = 0; break;
    case 'clear': sim.segments = []; break;
  }
}
function simSetButtons(){
  var run = el('btn-run'), stop = el('btn-stop');
  if (run) run.disabled = sim.running;
  if (stop) stop.disabled = !sim.running;
}
function simRun(){
  if (sim.running) return;
  var ta = el('sim-code');
  var st = el('sim-status');
  var res = parseProgram(ta.value);
  if (res.error){
    st.className = 'status status-err';
    st.textContent = '⚠ Ошибка в строке ' + res.error.line + ': ' + res.error.text + ' Исправь эту ошибку и запусти снова!';
    return;
  }
  if (!res.ops.length){
    st.className = 'status status-err';
    st.textContent = 'Программа пустая — напиши хотя бы одну команду 🙂';
    return;
  }
  clearTimeout(sim.timer);
  simReset();
  sim.ops = res.ops; sim.idx = 0; sim.running = true;

  // длинные программы (после раскрытия циклов) выполняем пачками и быстрее
  var n = sim.ops.length;
  sim.batch = n > 200 ? Math.ceil(n / 200) : 1;
  var sel = el('sim-speed');
  var base = SPEEDS[sel ? sel.value : 'normal'] || SPEEDS.normal;
  if (n > 40)  base = Math.max(50, Math.round(base * 0.4));
  if (n > 200) base = Math.max(20, Math.round(base * 0.5));
  sim.delay = base;

  simSetButtons();
  st.className = 'status';
  st.textContent = 'Выполняю программу…';
  sim.timer = setTimeout(function tick(){
    if (sim.idx >= sim.ops.length){
      sim.running = false; simSetButtons();
      st.className = 'status status-ok';
      st.textContent = '🎉 Готово! Программа работает без ошибок — ' + sim.ops.length + ' шагов. Отличная отладка!';
      simDraw();
      return;
    }
    for (var b=0; b<sim.batch && sim.idx<sim.ops.length; b++){
      applyOp(sim.ops[sim.idx++]);
    }
    simDraw();
    sim.timer = setTimeout(tick, sim.delay);
  }, sim.delay);
}
function simStop(){
  clearTimeout(sim.timer);
  if (sim.running){
    sim.running = false;
    simSetButtons();
    var st = el('sim-status');
    if (st){ st.className = 'status'; st.textContent = 'Остановлено.'; }
  }
}
function simDownload(){
  var cv = el('sim-canvas');
  if (!cv) return;
  var st = el('sim-status');
  if (!sim.segments.length){
    st.className = 'status status-err';
    st.textContent = 'Пока нечего скачивать — сначала нарисуй что-нибудь 🙂';
    return;
  }
  // переносим рисунок на белый фон и сохраняем как PNG
  var tmp = document.createElement('canvas');
  tmp.width = cv.width; tmp.height = cv.height;
  var tctx = tmp.getContext('2d');
  tctx.fillStyle = '#ffffff';
  tctx.fillRect(0,0,tmp.width,tmp.height);
  tctx.drawImage(cv,0,0);
  var link = document.createElement('a');
  link.download = 'finalnyi-proekt.png';
  link.href = tmp.toDataURL('image/png');
  link.click();
  st.className = 'status status-ok';
  st.textContent = '📷 Финальный рисунок сохранён в загрузки! Прикрепи его ниже — это главный продукт курса.';
}

/* ---------- Чек-лист ---------- */
function updateCheckProgress(){
  var prog = el('check-progress');
  if (!prog) return;
  var done = 0;
  for (var i=0;i<state.project.checks.length;i++){
    if (state.project.checks[i]) done++;
  }
  prog.textContent = 'отмечено ' + done + ' из ' + state.project.checks.length;
  if (done === state.project.checks.length){
    var e = el('e-check');
    if (e) e.hidden = true;
  }
}

/* ---------- Область финального рисунка ---------- */
function renderShotArea(){
  var a = el('shot-area');
  if (!a) return;
  while (a.firstChild) a.removeChild(a.firstChild);
  if (state.project.hasShot && state.shotUrl){
    var img = document.createElement('img');
    img.src = state.shotUrl;
    img.alt = 'Финальный рисунок проекта';
    img.className = 'shot-img';
    var cap = document.createElement('p');
    cap.className = 'shot-cap';
    cap.textContent = '✔ Прикреплено: ' + state.project.shotName;
    var rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'btn btn-ghost';
    rm.textContent = 'Удалить рисунок';
    rm.addEventListener('click', function(){
      if (state.shotUrl) URL.revokeObjectURL(state.shotUrl);
      state.shotUrl = null;
      state.project.hasShot = false;
      state.project.shotName = '';
      var inp = el('shot-input'); if (inp) inp.value = '';
      save(); renderShotArea();
    });
    a.appendChild(img); a.appendChild(cap); a.appendChild(rm);
  } else {
    var p = document.createElement('p');
    p.className = 'muted';
    p.textContent = state.project.shotName
      ? 'Раньше был прикреплён файл «' + state.project.shotName + '», но браузер не хранит картинки — прикрепи финальный рисунок заново.'
      : 'Финальный рисунок пока не прикреплён.';
    a.appendChild(p);
  }
}

function setupPractice(){
  /* --- напоминание о проекте из Урока 4 (textContent — безопасно) --- */
  if (lesson4){
    var iEl = el('l4-idea'), tEl = el('l4-title'), pEl = el('l4-plan');
    if (iEl) iEl.textContent = lesson4.idea || '—';
    if (tEl) tEl.textContent = lesson4.title || '—';
    if (pEl) pEl.textContent = lesson4.plan || '—';
  }

  /* --- тренажёр --- */
  var ta = el('sim-code');
  ta.value = state.simCode || '';
  simReset();
  simSetButtons();
  var saveSim = debounce(function(){ state.simCode = ta.value; save(); }, 400);
  ta.addEventListener('input', saveSim);
  el('btn-run').addEventListener('click', function(){ state.simCode = ta.value; save(); simRun(); });
  el('btn-stop').addEventListener('click', simStop);
  el('btn-download').addEventListener('click', simDownload);
  el('btn-clear').addEventListener('click', function(){ simStop(); simReset(); var st = el('sim-status'); st.className='status'; st.textContent='Поле очищено. Можно рисовать заново!'; });
  el('btn-buggy').addEventListener('click', function(){
    simStop();
    ta.value = BUGGY_CODE;
    state.simCode = BUGGY_CODE; save();
    var st = el('sim-status');
    st.className = 'status';
    st.textContent = '🐛 В этом коде спрятаны 3 ошибки! Нажми «▶ Запустить», читай подсказки и исправляй по одной.';
  });

  /* --- название проекта --- */
  var titleInput = el('p-title');
  titleInput.value = state.project.title || (lesson4 && lesson4.title) || '';
  if (!state.project.title && titleInput.value){
    state.project.title = titleInput.value; save();
  }
  titleInput.addEventListener('input', debounce(function(){
    state.project.title = titleInput.value; save();
  }, 400));

  /* --- чек-лист --- */
  var checks = document.querySelectorAll('input[name="chk"]');
  for (var ci=0;ci<checks.length;ci++){
    checks[ci].addEventListener('change', function(){
      var idx = parseInt(this.getAttribute('data-idx'), 10);
      state.project.checks[idx] = this.checked;
      save();
      updateCheckProgress();
    });
  }
  updateCheckProgress();

  /* --- финальный код --- */
  var codeTa = el('project-code');
  codeTa.value = state.project.code;
  codeTa.addEventListener('input', debounce(function(){ state.project.code = codeTa.value; save(); }, 400));

  el('btn-from-sim').addEventListener('click', function(){
    var simTa = el('sim-code');
    state.simCode = simTa.value;
    codeTa.value = simTa.value;
    state.project.code = simTa.value;
    save();
    el('e-code').hidden = true;
    var btn = el('btn-from-sim');
    btn.textContent = '✔ Код вставлен!';
    setTimeout(function(){ btn.textContent = '⬆ Вставить код из тренажёра'; }, 2000);
  });

  /* --- финальный рисунок --- */
  var shotInput = el('shot-input');
  shotInput.addEventListener('change', function(){
    var err = el('e-shot');
    err.hidden = true;
    var f = shotInput.files && shotInput.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)){
      err.textContent = 'Можно прикрепить только картинку (PNG, JPG…). Попробуй ещё раз.';
      err.hidden = false;
      shotInput.value = '';
      return;
    }
    if (f.size > 8 * 1024 * 1024){
      err.textContent = 'Файл больше 8 МБ — попробуй картинку поменьше.';
      err.hidden = false;
      shotInput.value = '';
      return;
    }
    if (state.shotUrl) URL.revokeObjectURL(state.shotUrl);
    state.shotUrl = URL.createObjectURL(f);
    state.project.shotName = f.name;
    state.project.hasShot = true;
    save();
    renderShotArea();
  });
  renderShotArea();

  /* --- рефлексия --- */
  var refTa = el('p-reflection');
  refTa.value = state.project.reflection;
  refTa.addEventListener('input', debounce(function(){
    state.project.reflection = refTa.value; save();
  }, 400));

  /* --- завершение курса с проверкой всех полей --- */
  el('btn-submit').addEventListener('click', function(){
    simStop();
    state.project.title = titleInput.value;
    state.project.code = codeTa.value;
    state.project.reflection = refTa.value;

    var eTitle = el('e-title'), eCheck = el('e-check'),
        eCode = el('e-code'), eShot = el('e-shot'), eRef = el('e-reflection');
    eTitle.hidden = true; eCheck.hidden = true; eCode.hidden = true; eShot.hidden = true; eRef.hidden = true;
    var firstBad = null;

    if (state.project.title.trim().length < 2){
      eTitle.textContent = 'У финального проекта должно быть название!';
      eTitle.hidden = false;
      if (!firstBad) firstBad = titleInput;
    }
    if (!allChecksDone()){
      eCheck.textContent = 'Отметь все пункты чек-листа — настоящий программист проверяет проект перед сдачей 😉';
      eCheck.hidden = false;
      if (!firstBad) firstBad = document.querySelector('input[name="chk"]');
    }
    if (state.project.code.trim().length < 10){
      eCode.textContent = 'Вставь финальный код своей программы. Можно нажать «⬆ Вставить код из тренажёра».';
      eCode.hidden = false;
      if (!firstBad) firstBad = codeTa;
    }
    if (!state.project.hasShot){
      eShot.textContent = 'Финальный рисунок — главный продукт курса! Скачай его в тренажёре («📷 Скачать рисунок») и прикрепи здесь.';
      eShot.hidden = false;
      if (!firstBad) firstBad = shotInput;
    }
    if (state.project.reflection.trim().length < 20){
      eRef.textContent = 'Напиши хотя бы 2–3 предложения (от 20 символов) — это попадёт в твой итоговый отчёт.';
      eRef.hidden = false;
      if (!firstBad) firstBad = refTa;
    }
    if (firstBad){
      firstBad.focus();
      firstBad.scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    state.screen = 'result';
    save();
    render();
  });
}

/* ============================================================
   ЭКРАН: ИТОГ КУРСА
============================================================ */
function resultHTML(){

  var h = '<section class="screen">' + backHTML();
  h += '<div class="card result-hero">';
  h += '<div class="logo" aria-hidden="true">🎓</div>';
  h += '<h1 id="screen-title" tabindex="-1">Курс пройден!</h1>';
  h += '<p class="subtitle" style="margin-bottom:8px"><span id="res-name"></span> · класс <span id="res-class"></span> · ' + dateStr + '</p>';
  h += '<div class="result-total">' + sc.total + '<span class="muted" style="font-size:20px;font-weight:500"> / 20 баллов</span></div>';
  h += '<p class="result-rating">' + ratingText(sc.total) + '</p>';
  h += '<p class="muted">Результат урока: ' + sc.percent + '% · чек-лист пройден полностью ✔</p>';
  h += '</div>';

  h += '<div class="card"><h2>Из чего сложились баллы</h2><ul class="res-rows">';
  h += '<li><span>Тест по отладке: ' + (state.quiz.checked ? sc.correct + ' из 5 верных ответов' : 'не пройден') + '</span><span class="pts">' + sc.quizPoints + ' / 10</span></li>';
  h += '<li><span>Финальный код проекта ' + (sc.codePoints ? '<span class="ok-mark">✔ приложен</span>' : '<span class="bad-mark">✘ не найден</span>') + '</span><span class="pts">' + sc.codePoints + ' / 5</span></li>';
  h += '<li><span>Финальный рисунок ' + (sc.shotPoints ? '<span class="ok-mark">✔ прикреплён</span>' : '<span class="bad-mark">✘ не прикреплён</span>') + '</span><span class="pts">' + sc.shotPoints + ' / 5</span></li>';
  h += '</ul>';
  h += '<p class="muted" style="margin:8px 0 0">Итоговый продукт курса: <b id="res-proj"></b></p>';
  h += '</div>';

  h += '<div class="card tinted"><h2>Ты — молодец! 🌟</h2>';
  h += '<p>За 5 уроков ты прошёл путь настоящего исследователя: узнал, что такое программы и алгоритмы, научился управлять черепашкой, использовать циклы, придумал, запрограммировал и отладил <b>собственный проект</b>.</p>';
  h += '<p style="margin:0">Обязательно сохрани итоговый отчёт в PDF и отправь учителю. А если впереди Урок 6 — готовься показать проект классу! 🎤</p></div>';

  h += '<div class="actions">';
  h += '<button class="btn btn-primary" id="btn-print" type="button">💾 Сохранить итоговый отчёт в PDF</button>';
  h += '<button class="btn btn-ghost" id="btn-restart" type="button">↺ Пройти заново</button>';
  h += '</div>';
  h += '<div class="lesson-nav">';
  h += '<a class="btn btn-secondary" href="turtle4.html">← Урок 4</a>';
  h += '<a class="btn btn-secondary" href="index.html">🏠 Все уроки</a>';
  h += '<a class="btn btn-primary" href="turtle6.html">Урок 6: Презентация →</a>';
  h += '</div>';
  h += '<p class="muted" style="margin-top:12px">Кнопка откроет окно печати — там выбери «Сохранить как PDF». Отправь файл учителю 📩</p>';
  h += '</section>';
  return h;
}

function setupResult(){
  var nameEl = el('res-name'), classEl = el('res-class');
  if (nameEl) nameEl.textContent = state.name;
  if (classEl) classEl.textContent = state.klass;
  var projEl = el('res-proj');
  if (projEl){
    var title = state.project.title.trim() || (lesson4 && lesson4.title) || 'Без названия';
    var idea = (lesson4 && lesson4.idea) ? lesson4.idea : '';
    projEl.textContent = '«' + title + '»' + (idea ? ' · ' + idea : '') + ' · Графический рисунок в Turtle (Python)';
  }
  el('btn-print').addEventListener('click', function(){
    buildPrintReport();
    window.print();
  });
  el('btn-restart').addEventListener('click', function(){
    if (window.confirm('Начать урок заново? Все ответы, чек-лист и отчёт будут удалены.')){
      clearSaved(); savedData = null;
      if (state.shotUrl) URL.revokeObjectURL(state.shotUrl);
      state = freshState();
      render();
    }
  });
  buildPrintReport(); // отчёт готов заранее
}

/* ============================================================
   ПЕЧАТНЫЙ ОТЧЁТ ПО КУРСУ (для «Сохранить как PDF»)
   Безопасно: только createElement + textContent, без innerHTML
============================================================ */
function buildPrintReport(){
  var r = el('print-report');
  while (r.firstChild) r.removeChild(r.firstChild);
  function mk(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null) e.textContent = txt;
    return e;
  }
  var sc = computeScore();
  var dateStr = new Date().toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });

  r.appendChild(mk('h1','pr-h1','Итоговый отчёт по курсу · Урок 5'));
  r.appendChild(mk('p','pr-sub','Курс «Я — исследователь: первые шаги в программировании» · Разработка и отладка проекта'));

  var meta = mk('p','pr-meta');
  meta.appendChild(mk('div',null,'Ученик: ' + state.name));
  meta.appendChild(mk('div',null,'Класс: ' + state.klass));
  meta.appendChild(mk('div',null,'Дата: ' + dateStr));
  r.appendChild(meta);

  // Проект
  r.appendChild(mk('h2','pr-h2','Итоговый продукт курса'));
  var pmeta = mk('p','pr-meta');
  pmeta.appendChild(mk('div',null,'Название: «' + (state.project.title.trim() || 'Без названия') + '»'));
  if (lesson4 && lesson4.idea) pmeta.appendChild(mk('div',null,'Идея: ' + lesson4.idea));
  pmeta.appendChild(mk('div',null,'Тип продукта: графический рисунок в Turtle (Python)'));
  r.appendChild(pmeta);
  if (lesson4 && lesson4.plan){
    r.appendChild(mk('p',null,'План проекта (из Урока 4):'));
    r.appendChild(mk('div','pr-text', lesson4.plan));
  }

  // Тест
  r.appendChild(mk('h2','pr-h2','Тест по отладке и тестированию (' + sc.correct + ' из 5 верно · ' + sc.quizPoints + ' баллов)'));
  var ol = mk('ol','pr-quiz');
  for (var i=0;i<QUIZ.length;i++){
    var li = document.createElement('li');
    var ansIdx = state.quiz.answers[i];
    var isOk = ansIdx === QUIZ[i].correct;
    li.appendChild(mk('span',null,QUIZ[i].q + ' — '));
    li.appendChild(mk('b',null, ansIdx === null ? 'нет ответа' : QUIZ[i].options[ansIdx]));
    li.appendChild(mk('span', isOk ? 'ok-mark' : 'bad-mark', isOk ? ' ✔' : ' ✘ (верный ответ: ' + QUIZ[i].options[QUIZ[i].correct] + ')'));
    ol.appendChild(li);
  }
  r.appendChild(ol);

  // Чек-лист
  r.appendChild(mk('h2','pr-h2','Чек-лист проверки проекта'));
  var ul = mk('ul','pr-checks');
  for (var c=0;c<CHECKLIST.length;c++){
    var li2 = document.createElement('li');
    li2.appendChild(mk('span', state.project.checks[c] ? 'ok-mark' : 'bad-mark', state.project.checks[c] ? '✔ ' : '✘ '));
    li2.appendChild(document.createTextNode(CHECKLIST[c]));
    ul.appendChild(li2);
  }
  r.appendChild(ul);

  // Финальный код
  r.appendChild(mk('h2','pr-h2','Финальный код проекта'));
  r.appendChild(mk('pre','pr-code', state.project.code.trim() ? state.project.code : '(код не приложен)'));

  // Финальный рисунок
  r.appendChild(mk('h2','pr-h2','Финальный рисунок'));
  if (state.project.hasShot && state.shotUrl){
    var img = document.createElement('img');
    img.src = state.shotUrl;
    img.alt = 'Финальный рисунок проекта';
    img.className = 'pr-img';
    r.appendChild(img);
  } else {
    r.appendChild(mk('p','pr-sub','(рисунок не прикреплён)'));
  }

  // Рефлексия
  r.appendChild(mk('h2','pr-h2','Мои впечатления о курсе'));
  r.appendChild(mk('div','pr-text', state.project.reflection.trim() || '(не заполнено)'));

  // Итог
  var totalP = mk('p','pr-total');
  totalP.appendChild(mk('b',null,'Итог урока: ' + sc.total + ' из 20 баллов (' + sc.percent + '%). '));
  totalP.appendChild(document.createTextNode(ratingText(sc.total)));
  r.appendChild(totalP);
  r.appendChild(mk('p','pr-sub','Курс «Я — исследователь: первые шаги в программировании» завершён 🎓 · Учитель информатики'));
}

/* ============================================================
   РОУТЕР / RENDER
============================================================ */
var BACK_MAP = { theory:'start', quiz:'theory', practice:'quiz', result:'practice' };

function render(){
  simStop();
  var app = el('app');
  var html = headerHTML();
  switch(state.screen){
    case 'theory':   html += theoryHTML();   break;
    case 'quiz':     html += quizHTML();     break;
    case 'practice': html += practiceHTML(); break;
    case 'result':   html += resultHTML();   break;
    default:         html += startHTML();    state.screen = 'start';
  }
  app.innerHTML = html; // только статические шаблоны — без пользовательского ввода
  setupScreen();
  window.scrollTo(0,0);
  var title = el('screen-title');
  if (title) title.focus();
}

function setupScreen(){
  // общая кнопка «Назад»
  var back = el('btn-back');
  if (back){
    back.addEventListener('click', function(){
      var prev = BACK_MAP[state.screen] || 'start';
      state.screen = prev;
      save();
      render();
    });
  }
  switch(state.screen){
    case 'start':    setupStart();    break;
    case 'theory':   setupTheory();   break;
    case 'quiz':     setupQuiz();     break;
    case 'practice': setupPractice(); break;
    case 'result':   setupResult();   break;
  }
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
============================================================ */
function init(){
  savedData = load();
  state = freshState();
  render();
}
init();
</script>
